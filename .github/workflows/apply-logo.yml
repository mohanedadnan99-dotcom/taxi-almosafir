name: Apply company logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-logo.yml'

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch website branding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          favicon = '<link rel="icon" type="image/svg+xml" href="/assets/logo/almosafir-logo.svg" />'
          if favicon not in s:
              s = s.replace('<meta name="theme-color" content="#07111f" />', '<meta name="theme-color" content="#07111f" />\n' + favicon)
          old_logo_css = '.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid rgba(213,171,99,.42);background:rgba(213,171,99,.08);color:var(--gold2)}'
          new_logo_css = '.logo{width:46px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid rgba(213,171,99,.30);background:rgba(255,255,255,.04);overflow:hidden;padding:3px}.logo img{width:100%;height:100%;object-fit:contain;display:block}'
          s = s.replace(old_logo_css, new_logo_css)
          s = s.replace('<div class="logo">✦</div>', '<div class="logo"><img src="/assets/logo/almosafir-logo.svg" alt="تكسي المسافر"></div>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit branding update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: show company logo in site header"
          git push
