name: Convert Tucson to PNG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-tucson-png.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Convert Tucson WebP to PNG and update site
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('assets/cars/tucson-v2.webp')
          target = Path('assets/cars/tucson-final.png')
          with Image.open(source) as im:
              im = im.convert('RGBA')
              im.save(target, 'PNG', optimize=True)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '/assets/cars/tucson-v2.webp?v=20260901-2'
          new = '/assets/cars/tucson-final.png?v=20260901-3'
          if old not in s:
              raise SystemExit('Tucson source marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit final Tucson PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/cars/tucson-final.png
          git rm .github/workflows/convert-tucson-png.yml
          git commit -m "fix: use PNG Tucson image for iPhone compatibility"
          git push
