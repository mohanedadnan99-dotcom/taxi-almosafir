name: Polish final admin integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-final-admin.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final integration polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/admin-final.js')
          s=p.read_text()
          s=s.replace("config.vehicles.map(v=>({name:v.name,image:v.image,className:v.className,desc:v.descriptionAr||''}))", "config.vehicles.filter(v=>v.active).map(v=>({name:v.name,image:v.image,className:v.className,desc:v.descriptionAr||''}))")
          s=s.replace("fetch('/api/config',{cache:'no-store'})", "fetch('/api/config',{headers:token()?{Authorization:`Bearer ${token()}`}:{},cache:'no-store'})")
          s=s.replace('id="backupJson"', 'class="backupJsonBtn"')
          s=s.replace('id="printAdmin"', 'class="printAdminBtn"')
          s=s.replace("e.target.closest('#backupJson')", "e.target.closest('.backupJsonBtn')")
          s=s.replace("e.target.closest('#printAdmin')", "e.target.closest('.printAdminBtn')")
          p.write_text(s)

          v=Path('vercel.json')
          import json
          data=json.loads(v.read_text())
          headers=data.setdefault('headers',[])
          global_rule=next((x for x in headers if x.get('source')=='/(.*)'),None)
          if global_rule:
            existing={h['key'].lower() for h in global_rule.get('headers',[])}
            additions=[
              {'key':'X-Frame-Options','value':'DENY'},
              {'key':'Permissions-Policy','value':'camera=(), microphone=(), geolocation=(self)'},
            ]
            for h in additions:
              if h['key'].lower() not in existing: global_rule['headers'].append(h)
          if not any(x.get('source')=='/admin' for x in headers):
            headers.append({'source':'/admin','headers':[{'key':'X-Robots-Tag','value':'noindex, nofollow, noarchive'}]})
          v.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit polish
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/admin-final.js vercel.json
          git commit -m "fix: harden and polish final admin modules [skip ci]"
          git push
