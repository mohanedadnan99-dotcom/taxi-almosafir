name: Wire final admin modules
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-admin.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire scripts and styles
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text()
          vehicle = '<script src="/assets/vehicle-config.js?v=20260901-1"></script>'
          if vehicle not in text:
              text = text.replace('<script src="/assets/i18n.js?v=20260901-2"></script>', '<script src="/assets/i18n.js?v=20260901-2"></script>\n' + vehicle)
              index.write_text(text)

          admin = Path('admin.html')
          text = admin.read_text()
          css = '<link rel="stylesheet" href="/assets/admin-final.css?v=20260901-1">'
          js = '<script src="/assets/admin-final.js?v=20260901-1"></script>'
          if css not in text:
              text = text.replace('<link rel="stylesheet" href="/assets/admin.css?v=20260901-1">', '<link rel="stylesheet" href="/assets/admin.css?v=20260901-1">\n' + css)
          if js not in text:
              text = text.replace('<script src="/assets/admin.js?v=20260901-1"></script>', '<script src="/assets/admin.js?v=20260901-1"></script>\n' + js)
          admin.write_text(text)
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git commit -m "feat: activate final admin and centralized fleet modules [skip ci]"
          git push
