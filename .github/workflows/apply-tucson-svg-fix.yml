name: Apply Tucson Safari Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tucson-svg-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch Tucson to Safari-safe SVG
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='/assets/cars/tucson-v2.webp?v=20260901-2'
          new='/assets/cars/tucson-stable.svg?v=20260901-3'
          if old not in s:
              raise SystemExit('Tucson asset marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-tucson-svg-fix.yml
          git commit -m "fix: use Safari-safe Tucson SVG"
          git push
