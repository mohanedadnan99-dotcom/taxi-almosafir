name: Apply black Tucson image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-black-tucson.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use stable black Tucson image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          candidates=[
            '/assets/cars/tucson-v2.webp?v=20260901-2',
            '/assets/cars/tucson.webp',
            '/assets/cars/tucson-final.png?v=20260901-3'
          ]
          new='/assets/cars/tucson-black-final.jpg?v=20260901-4'
          found=False
          for old in candidates:
            if old in s:
              s=s.replace(old,new,1)
              found=True
              break
          if not found:
            raise SystemExit('Tucson image marker not found')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f assets/cars/tucson-black-final.jpg.b64-placeholder
          rm -f .github/workflows/convert-tucson-png.yml
          rm -f .github/workflows/apply-black-tucson.yml
      - name: Commit final Tucson fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use stable black Tucson vehicle image"
          git push
